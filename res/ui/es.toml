# The window in Spanish: each of its English texts -> its translation.

"European languages for PE2PC" = "Idiomas europeos para PE2PC"
"Makes a PE2PC mod of the dialogue, menus, items, pictures of text, loading captions and movies of your own French, German, Spanish or Italian discs of Parasite Eve II. Nothing of the game comes with this program: all is read from your discs." = "Crea un mod de PE2PC con los diálogos, menús, objetos, imágenes de texto, rótulos de carga y vídeos de tus propios discos franceses, alemanes, españoles o italianos de Parasite Eve II. Este programa no incluye nada del juego: todo se lee de tus discos."
"Not chosen" = "Sin elegir"
"Browse..." = "Examinar..."
"CD image" = "Imagen de CD"
"USA disc 1" = "Disco 1 USA"
"USA disc 2" = "Disco 2 USA"
"European disc 1" = "Disco 1 europeo"
"European disc 2" = "Disco 2 europeo"
"Choose PE2PC's program (pe2.exe): the import reads the discs with it." = "Elige el programa de PE2PC (pe2.exe): la importación lee los discos con él."
"Make the mod" = "Crear el mod"
"Reading the USA discs" = "Leyendo los discos USA"
"Reading your European discs" = "Leyendo tus discos europeos"
"Making the mod" = "Creando el mod"
"Converting the movies with text" = "Convirtiendo los vídeos con texto"
"This takes a few minutes. The discs are read into a temporary folder (about 2 GB), removed at the end." = "Tarda unos minutos. Los discos se leen en una carpeta temporal (unos 2 GB), que se borra al final."
"The mod is made." = "El mod está listo."
"lines of dialogue" = "líneas de diálogo"
"texts of the menus" = "textos de los menús"
"loading captions" = "rótulos de carga"
"The movies with text stay in English." = "Los vídeos con texto se quedan en inglés."
"Turn on Experimental features (mods) in PE2PC's Settings > General." = "Activa Funciones experimentales (mods) en Ajustes > General de PE2PC."
"In PE2PC's Mods tab, the mod is on. For PE2PC's own screens in your language too: Settings > General > Language." = "En la pestaña Mods de PE2PC, el mod está activado. Para tener también las pantallas de PE2PC en tu idioma: Ajustes > General > Idioma."
"Also on, turn it off in the Mods tab:" = "También activado, desactívalo en la pestaña Mods:"
"The import failed." = "La importación ha fallado."
