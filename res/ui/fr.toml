# The window in French: each of its English texts -> its translation.

"European languages for PE2PC" = "Langues européennes pour PE2PC"
"Makes a PE2PC mod of the dialogue, menus, items, pictures of text, loading captions and movies of your own French, German, Spanish or Italian discs of Parasite Eve II. Nothing of the game comes with this program: all is read from your discs." = "Fabrique un mod PE2PC avec les dialogues, menus, objets, images de texte, légendes de chargement et vidéos de vos propres disques français, allemands, espagnols ou italiens de Parasite Eve II. Rien du jeu n'est fourni avec ce programme : tout est lu sur vos disques."
"Not chosen" = "Non choisi"
"Browse..." = "Parcourir..."
"CD image" = "Image de CD"
"USA disc 1" = "Disque 1 USA"
"USA disc 2" = "Disque 2 USA"
"European disc 1" = "Disque 1 européen"
"European disc 2" = "Disque 2 européen"
"Without ffmpeg, the two movies with text stay in English." = "Sans ffmpeg, les deux vidéos avec du texte restent en anglais."
"Choose PE2PC's program (pe2.exe): the import reads the discs with it." = "Choisissez le programme de PE2PC (pe2.exe) : l'import lit les disques avec lui."
"Make the mod" = "Fabriquer le mod"
"Reading the USA discs" = "Lecture des disques USA"
"Reading your European discs" = "Lecture de vos disques européens"
