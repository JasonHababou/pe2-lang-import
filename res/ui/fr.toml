"In PE2PC's Mods tab, the mod is on. For PE2PC's own screens in your language too: Settings > General > Language." = "Dans l'onglet Mods de PE2PC, le mod est activé. Pour avoir aussi les écrans de PE2PC dans votre langue : Réglages > Général > Langue."
"Also on, turn it off in the Mods tab:" = "Aussi activé, à désactiver dans l'onglet Mods :"
